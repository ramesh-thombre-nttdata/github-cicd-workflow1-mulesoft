name: Build the project

# Controls when the workflow will run
on:
  push:
    branches:
      - 'feature/**'

jobs:
  buildAndPublishToExchange:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Build with Maven
      env:
        CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        encryptionKey: ${{ secrets.ENCRYPTION_NON_PROD_KEY }}
      run: mvn clean -B deploy -DskipMunitTests -s .maven/settings.xml
